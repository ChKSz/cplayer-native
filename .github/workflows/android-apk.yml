name: Build Android APK (Tauri 2)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'APK Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    env:
      # Job-level env so signing logic can inspect it (secrets context is not allowed in step `if`)
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies & run unit tests
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default 'tools' package no longer exists in new cmdline-tools -> only install platform-tools
          packages: 'platform-tools'

      - name: Install Android NDK 27
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust stable with aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: android-aarch64

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'scripts/patch-android.mjs') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Gradle Maven Central mirror
        run: |
          echo -n "Google GCS Maven mirror status: "
          curl -sS -o /dev/null -w "%{http_code}\n" "https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.3.21/kotlin-stdlib-2.3.21.pom" || true
          echo -n "Maven Central (apache) status: "
          curl -sS -o /dev/null -w "%{http_code}\n" "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.3.21/kotlin-stdlib-2.3.21.pom" || true
          mkdir -p "${HOME}/.gradle/init.d"
          cat > "${HOME}/.gradle/init.d/maven-mirrors.gradle" <<'EOF'
          def gcsMirror = java.net.URI.create("https://maven-central.storage-download.googleapis.com/maven2/")

          gradle.beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      maven {
                          name = "GoogleMavenCentralMirror"
                          url = gcsMirror
                      }
                      google()
                      gradlePluginPortal()
                      mavenCentral()
                  }
              }
          }

          gradle.allprojects { project ->
              project.buildscript.repositories {
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = gcsMirror
                  }
              }
              project.repositories {
                  maven {
                      name = "GoogleMavenCentralMirror"
                      url = gcsMirror
                  }
              }
          }
          EOF

      - name: Initialize Tauri Android project & apply native patches
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon-manifest.json
          node scripts/patch-android.mjs

      - name: Build Android APK (arm64-v8a)
        env:
          BUILD_MODE: ${{ github.event.inputs.build_mode || 'release' }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            npx tauri android build --apk --target aarch64 --ci
          else
            npx tauri android build --apk --target aarch64 --debug --ci
          fi

      - name: Align & Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No unsigned release APK found (debug build is already debug-signed); skipping signing."
            exit 0
          fi
          ZIPALIGN="${ANDROID_HOME}/build-tools/35.0.0/zipalign"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" /tmp/aligned.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            SIGNED_APK="${UNSIGNED_APK/-unsigned/-signed}"
            "$APKSIGNER" sign \
              --ks /tmp/release.keystore \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out "$SIGNED_APK" \
              /tmp/aligned.apk
            rm -f /tmp/release.keystore /tmp/aligned.apk "$UNSIGNED_APK"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not configured; signing release APK with ephemeral debug keystore. Configure release keystore secrets for overwrite-install upgrades."
            keytool -genkeypair -v \
              -keystore /tmp/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            SIGNED_APK="${UNSIGNED_APK/-unsigned/-debug-signed}"
            "$APKSIGNER" sign \
              --ks /tmp/debug.keystore \
              --ks-pass "pass:android" \
              --ks-key-alias androiddebugkey \
              --key-pass "pass:android" \
              --out "$SIGNED_APK" \
              /tmp/aligned.apk
            rm -f /tmp/debug.keystore /tmp/aligned.apk "$UNSIGNED_APK"
          fi
          "$APKSIGNER" verify "$SIGNED_APK"

      - name: Collect APK artifact
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" ! -name "*unsigned*.apk" -exec cp -v {} dist-apk/ \;
          ls -lh dist-apk/
          python3 - <<'PY'
          import glob, os, zipfile
          for apk_path in sorted(glob.glob("dist-apk/*.apk")):
              size_mb = os.path.getsize(apk_path) / (1024 * 1024)
              print(f"=== {os.path.basename(apk_path)}: {size_mb:.2f} MB ===")
              with zipfile.ZipFile(apk_path, "r") as z:
                  for info in sorted(z.infolist(), key=lambda x: -x.compress_size)[:15]:
                      print(f"  {info.compress_size/1024:8.1f} KB (raw {info.file_size/1024:8.1f} KB)  {info.filename}")
          PY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cplayer-android-arm64-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "CPlayer ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: dist-apk/*.apk
