name: Build Android APK (Tauri 2)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'APK Build Mode'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    env:
      # Job-level env so the signing step's `if` can check it (secrets context is not allowed in step `if`)
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies & run unit tests
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default 'tools' package no longer exists in new cmdline-tools -> only install platform-tools
          packages: 'platform-tools'

      - name: Install Android NDK 27
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust stable with aarch64-linux-android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: android-aarch64

      - name: Initialize Tauri Android project & apply native patches
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
          node scripts/patch-android.mjs

      - name: Build Android APK (arm64-v8a)
        env:
          BUILD_MODE: ${{ github.event.inputs.build_mode || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug') }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            npx tauri android build --apk --target aarch64 --ci
          else
            npx tauri android build --apk --target aarch64 --debug --ci
          fi

      - name: Sign Release APK (optional if keystore secrets configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned*.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
            SIGNED_APK="${UNSIGNED_APK/-unsigned/-signed}"
            "$APKSIGNER" sign \
              --ks /tmp/release.keystore \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out "$SIGNED_APK" \
              "$UNSIGNED_APK"
            rm -f /tmp/release.keystore
          fi

      - name: Collect APK artifact
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp -v {} dist-apk/ \;
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cplayer-android-arm64-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          generate_release_notes: true
